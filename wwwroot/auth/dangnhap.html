<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Smart Bus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f9ff;
            color: #12345b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border: 1px solid #dce9f4;
            border-radius: 24px;
            padding: 45px 50px;
            box-shadow: 0 10px 35px rgba(0, 85, 170, 0.10);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 55px;
            height: 55px;
            background: #087df5;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 28px;
        }

        .login-header h1 {
            color: #123c75;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #7890a8;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

            .form-group label {
                display: block;
                font-size: 14px;
                font-weight: bold;
                color: #294e72;
                margin-bottom: 8px;
            }

        .input-box {
            width: 100%;
            height: 52px;
            border: 1px solid #d5e3ef;
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            background: #fbfdff;
            transition: 0.25s;
        }

            .input-box:hover {
                border-color: #9dccf7;
            }

            .input-box:focus-within {
                border-color: #087df5;
                background: white;
                box-shadow: 0 0 0 3px rgba(8, 125, 245, 0.08);
            }

        .input-icon {
            font-size: 18px;
            margin-right: 10px;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: #294e72;
            font-size: 14px;
        }

        .login-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 10px;
            background: #087df5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 7px 18px rgba(8, 125, 245, 0.25);
            margin-top: 10px;
        }

            .login-btn:hover {
                background: #0566cf;
                transform: translateY(-2px);
            }

            .login-btn:disabled {
                background: #b0c9e2;
                cursor: not-allowed;
                transform: none;
                box-shadow: none;
            }

        .register-text {
            text-align: center;
            margin-top: 22px;
            color: #7890a8;
            font-size: 14px;
        }

            .register-text a {
                color: #087df5;
                text-decoration: none;
                font-weight: bold;
            }

        .footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #edf2f7;
            color: #9aabbc;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">🚌</div>
            <h1>ĐĂNG NHẬP</h1>
            <p>Truy cập hệ thống vé xe Smart Bus</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email hoặc Số điện thoại</label>
                <div class="input-box">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" name="username" placeholder="Nhập email hoặc số điện thoại" required>
                </div>
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <div class="input-box">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
                </div>
            </div>

            <button type="submit" id="loginSubmitBtn" class="login-btn">Đăng nhập</button>
        </form>

        <div class="register-text">
            Chưa có tài khoản?
            <a href="/auth/dangky.html">Đăng ký ngay</a>
        </div>

        <div class="footer">
            🚌 <strong>Smart Bus</strong> - Hệ thống đặt vé xe thông minh
        </div>
    </div>

    <script>
                // @ts-nocheck
                document.addEventListener("DOMContentLoaded", function () {
                    const loginForm = document.querySelector("#loginForm");
                    if (!loginForm) return;

                    loginForm.addEventListener("submit", async function (event) {
                        event.preventDefault();

                        const usernameInput = document.querySelector("input#username");
                        const passwordInput = document.querySelector("input#password");
                        const loginSubmitBtn = document.querySelector("button#loginSubmitBtn");

                        if (!usernameInput || !passwordInput) return;

                        const email = usernameInput.value.trim();
                        const password = passwordInput.value.trim();

                        if (loginSubmitBtn) {
                            loginSubmitBtn.disabled = true;
                            loginSubmitBtn.textContent = "Đang xử lý...";
                        }

                        try {
                            const response = await fetch("/api/auth/login", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ Email: email, Password: password })
                            });

                            if (response.ok) {
                                const data = await response.json();
                                alert(`✅ Đăng nhập thành công!\nXin chào ${data.fullName || "bạn"}`);
                                localStorage.setItem("userSession", JSON.stringify(data));

                                if (data.role === "ADMIN" || data.role === "MANAGER") {
                                    window.location.href = "/quan-ly-tuyen-tram/index.html";
                                } else {
                                    window.location.href = "/index.html";
                                }
                            } else {
                                const errJson = await response.json().catch(() => null);
                                alert("❌ Lỗi: " + (errJson?.message || "Tài khoản hoặc mật khẩu không chính xác."));
                            }
                        } catch (err) {
                            console.error("Lỗi:", err);
                            alert("❌ Không thể kết nối đến máy chủ.");
                        } finally {
                            if (loginSubmitBtn) {
                                loginSubmitBtn.disabled = false;
                                loginSubmitBtn.textContent = "Đăng nhập";
                            }
                        }
                    });
                });
    </script>
</body>
</html>
