<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Smart Bus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f9ff;
            color: #12345b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .register-container {
            width: 100%;
            max-width: 650px;
            background: white;
            border: 1px solid #dce9f4;
            border-radius: 24px;
            padding: 45px 55px;
            box-shadow: 0 10px 35px rgba(0, 85, 170, 0.10);
        }

        .register-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            width: 55px;
            height: 55px;
            background: #087df5;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 28px;
        }

        .register-header h1 {
            color: #123c75;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .register-header p {
            color: #7890a8;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

            .form-group label {
                display: block;
                font-size: 14px;
                font-weight: bold;
                color: #294e72;
                margin-bottom: 8px;
            }

        .required {
            color: red;
        }

        .input-box {
            width: 100%;
            height: 52px;
            border: 1px solid #d5e3ef;
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            background: #fbfdff;
            transition: 0.25s;
        }

            .input-box:hover {
                border-color: #9dccf7;
            }

            .input-box:focus-within {
                border-color: #087df5;
                background: white;
                box-shadow: 0 0 0 3px rgba(8, 125, 245, 0.08);
            }

        .input-icon {
            font-size: 18px;
            margin-right: 10px;
        }

        .input-box input, .input-box select {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: #294e72;
            font-size: 14px;
        }

            .input-box input::placeholder {
                color: #9aabbc;
            }

        .row {
            display: flex;
            gap: 15px;
        }

            .row .form-group {
                flex: 1;
            }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 5px 0 25px;
            font-size: 13px;
            line-height: 1.5;
            color: #71899f;
        }

            .terms input {
                margin-top: 3px;
                width: 16px;
                height: 16px;
                accent-color: #087df5;
                cursor: pointer;
            }

            .terms a {
                color: #087df5;
                text-decoration: none;
                font-weight: bold;
            }

                .terms a:hover {
                    text-decoration: underline;
                }

        .register-button {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 10px;
            background: #087df5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 7px 18px rgba(8, 125, 245, 0.25);
        }

            .register-button:hover {
                background: #0566cf;
                transform: translateY(-2px);
            }

            .register-button:disabled {
                background: #b0c9e2;
                cursor: not-allowed;
                transform: none;
                box-shadow: none;
            }

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #7890a8;
            font-size: 14px;
        }

            .login-text a {
                color: #087df5;
                text-decoration: none;
                font-weight: bold;
            }

        .footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #edf2f7;
            color: #9aabbc;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 15px;
            }

            .register-container {
                padding: 30px 22px;
                border-radius: 18px;
            }

            .register-header h1 {
                font-size: 24px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }
        }
        .register-toast {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translate(-50%,20px);
            min-width: 280px;
            max-width: 460px;
            padding: 13px 18px;
            background: #fff;
            border: 1px solid #dce8f2;
            border-radius: 10px;
            color: #294e72;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0,85,170,.14);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
            z-index: 9999;
        }

            .register-toast.show {
                opacity: 1;
                transform: translate(-50%,0);
            }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <div class="logo">🚌</div>
            <h1>ĐĂNG KÝ</h1>
            <p>Tạo tài khoản để sử dụng Smart Bus</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label>Họ và tên <span class="required">*</span></label>
                <div class="input-box">
                    <span class="input-icon">👤</span>
                    <input type="text" id="fullName" name="fullName" placeholder="Nhập họ và tên" required>
                </div>
            </div>

            <div class="form-group">
                <label>Số điện thoại <span class="required">*</span></label>
                <div class="input-box">
                    <span class="input-icon">📱</span>
                    <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại" required pattern="[0-9]{10}">
                </div>
            </div>

            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <div class="input-box">
                    <span class="input-icon">✉️</span>
                    <input type="email" id="email" name="email" placeholder="Nhập email" required>
                </div>
            </div>

            <div class="form-group">
                <label>Mật khẩu <span class="required">*</span></label>
                <div class="input-box">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" minlength="6" required>
                </div>
            </div>

            <div class="form-group">
                <label>Nhập lại mật khẩu <span class="required">*</span></label>
                <div class="input-box">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Nhập lại mật khẩu" minlength="6" required>
                </div>
            </div>

            <div class="terms">
                <input type="checkbox" id="terms" required>
                <div>Tôi đồng ý với <a href="#">điều khoản</a> và <a href="#">chính sách</a>.</div>
            </div>

            <button type="submit" id="submitBtn" class="register-button">Đăng ký</button>
        </form>

        <div class="login-text">
            Bạn đã có tài khoản? <a href="/auth/dangnhap.html">Đăng nhập</a>
        </div>
        <div class="footer">🚌 <strong>Smart Bus</strong> - Hệ thống đặt vé xe thông minh</div>
    </div>

    <div id="registerToast" class="register-toast"></div>

    <script>
            // @ts-nocheck

            function showRegisterToast(
                message,
                duration = 2200
            ) {

                const toast =
                    document.getElementById(
                        "registerToast"
                    );

                if (!toast)
                    return;

                toast.textContent =
                    message;

                toast.classList.add(
                    "show"
                );

                clearTimeout(
                    window.registerToastTimer
                );

                window.registerToastTimer =
                    setTimeout(
                        () => {

                            toast.classList.remove(
                                "show"
                            );

                        },
                        duration
                    );
            }


            document.addEventListener(
                "DOMContentLoaded",
                function () {

                    const registerForm =
                        document.getElementById(
                            "registerForm"
                        );

                    if (!registerForm)
                        return;


                    registerForm.addEventListener(
                        "submit",
                        async function (event) {

                            event.preventDefault();

                            const fullName =
                                document
                                    .getElementById(
                                        "fullName"
                                    )
                                    ?.value
                                    .trim();

                            const phone =
                                document
                                    .getElementById(
                                        "phone"
                                    )
                                    ?.value
                                    .trim();

                            const email =
                                document
                                    .getElementById(
                                        "email"
                                    )
                                    ?.value
                                    .trim();

                            const password =
                                document
                                    .getElementById(
                                        "password"
                                    )
                                    ?.value;

                            const confirmPassword =
                                document
                                    .getElementById(
                                        "confirmPassword"
                                    )
                                    ?.value;

                            const terms =
                                document.getElementById(
                                    "terms"
                                );

                            const submitBtn =
                                document.getElementById(
                                    "submitBtn"
                                );


                            // ================================
                            // VALIDATION
                            // ================================

                            if (!fullName) {

                                showRegisterToast(
                                    "⚠️ Vui lòng nhập họ và tên."
                                );

                                return;
                            }


                            if (!phone) {

                                showRegisterToast(
                                    "⚠️ Vui lòng nhập số điện thoại."
                                );

                                return;
                            }


                            if (!/^\d{10}$/.test(phone)) {

                                showRegisterToast(
                                    "⚠️ Số điện thoại phải gồm đúng 10 chữ số."
                                );

                                return;
                            }


                            if (!email) {

                                showRegisterToast(
                                    "⚠️ Vui lòng nhập email."
                                );

                                return;
                            }


                            if (!password) {

                                showRegisterToast(
                                    "⚠️ Vui lòng nhập mật khẩu."
                                );

                                return;
                            }


                            if (password.length < 6) {

                                showRegisterToast(
                                    "⚠️ Mật khẩu phải có ít nhất 6 ký tự."
                                );

                                return;
                            }


                            if (
                                password !==
                                confirmPassword
                            ) {

                                showRegisterToast(
                                    "⚠️ Mật khẩu nhập lại không khớp."
                                );

                                return;
                            }


                            if (!terms?.checked) {

                                showRegisterToast(
                                    "⚠️ Vui lòng đồng ý với điều khoản và chính sách."
                                );

                                return;
                            }


                            if (submitBtn) {

                                submitBtn.disabled =
                                    true;

                                submitBtn.textContent =
                                    "Đang xử lý...";
                            }


                            try {

                                const response =
                                    await fetch(
                                        "/api/Auth/register",
                                        {
                                            method:
                                                "POST",

                                            headers:
                                            {
                                                "Content-Type":
                                                    "application/json"
                                            },

                                            body:
                                                JSON.stringify({
                                                    FullName:
                                                        fullName,

                                                    Phone:
                                                        phone,

                                                    Email:
                                                        email,

                                                    Password:
                                                        password
                                                })
                                        }
                                    );


                                const data =
                                    await response
                                        .json()
                                        .catch(
                                            () => null
                                        );


                                if (response.ok) {

                                    showRegisterToast(
                                        "✓ Đăng ký tài khoản thành công!",
                                        1000
                                    );

                                    setTimeout(
                                        () => {

                                            window.location.href =
                                                "/auth/dangnhap.html";

                                        },
                                        1000
                                    );

                                    return;
                                }


                                showRegisterToast(
                                    "❌ " +
                                    (
                                        data?.message ||
                                        "Đăng ký thất bại."
                                    )
                                );

                            }
                            catch (error) {

                                console.error(
                                    "Register error:",
                                    error
                                );

                                showRegisterToast(
                                    "❌ Không thể kết nối đến máy chủ."
                                );

                            }
                            finally {

                                if (submitBtn) {

                                    submitBtn.disabled =
                                        false;

                                    submitBtn.textContent =
                                        "Đăng ký";
                                }
                            }
                        }
                    );
                }
            );
    </script>
</body>
</html>
