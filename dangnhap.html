<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - Smart Bus</title>


    <style>

        /* =========================
           CÀI ĐẶT CHUNG
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, Helvetica, sans-serif;

            background: #f4f9ff;

            color: #12345b;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px 20px;

        }


        /* =========================
           KHUNG ĐĂNG NHẬP
        ========================= */

        .login-container {

            width: 100%;

            max-width: 500px;

            background: white;

            border: 1px solid #dce9f4;

            border-radius: 24px;

            padding: 45px 50px;

            box-shadow:
                0 10px 35px rgba(0, 85, 170, 0.10);

        }


        /* =========================
           HEADER
        ========================= */

        .login-header {

            text-align: center;

            margin-bottom: 35px;

        }


        .logo {

            width: 60px;

            height: 60px;

            background: #087df5;

            border-radius: 16px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0 auto 15px;

            font-size: 30px;

            box-shadow:
                0 6px 15px rgba(8, 125, 245, 0.20);

        }


        .login-header h1 {

            color: #123c75;

            font-size: 28px;

            margin-bottom: 8px;

        }


        .login-header p {

            color: #7890a8;

            font-size: 14px;

        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 20px;

        }


        .form-group label {

            display: block;

            font-size: 14px;

            font-weight: bold;

            color: #294e72;

            margin-bottom: 8px;

        }


        .required {

            color: red;

        }


        /* =========================
           Ô INPUT
        ========================= */

        .input-box {

            width: 100%;

            height: 52px;

            border: 1px solid #d5e3ef;

            border-radius: 10px;

            display: flex;

            align-items: center;

            padding: 0 15px;

            background: #fbfdff;

            transition: 0.25s;

        }


        .input-box:hover {

            border-color: #9dccf7;

        }


        .input-box:focus-within {

            border-color: #087df5;

            background: white;

            box-shadow:
                0 0 0 3px rgba(8, 125, 245, 0.08);

        }


        .input-icon {

            font-size: 18px;

            margin-right: 10px;

        }


        .input-box input {

            width: 100%;

            height: 100%;

            border: none;

            outline: none;

            background: transparent;

            color: #294e72;

            font-size: 14px;

        }


        .input-box input::placeholder {

            color: #9aabbc;

        }


        /* =========================
           QUÊN MẬT KHẨU
        ========================= */

        .forgot-password {

            text-align: right;

            margin-top: -10px;

            margin-bottom: 25px;

        }


        .forgot-password a {

            color: #087df5;

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;

        }


        .forgot-password a:hover {

            text-decoration: underline;

        }


        /* =========================
           NÚT ĐĂNG NHẬP
        ========================= */

        .login-button {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 10px;

            background: #087df5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;

            box-shadow:
                0 7px 18px rgba(8, 125, 245, 0.25);

        }


        .login-button:hover {

            background: #0566cf;

            transform: translateY(-2px);

            box-shadow:
                0 10px 22px rgba(8, 125, 245, 0.30);

        }


        .login-button:active {

            transform: translateY(0);

        }


        /* =========================
           ĐĂNG KÝ
        ========================= */

        .register-text {

            text-align: center;

            margin-top: 25px;

            color: #7890a8;

            font-size: 14px;

        }


        .register-text a {

            color: #087df5;

            text-decoration: none;

            font-weight: bold;

            margin-left: 4px;

        }


        .register-text a:hover {

            text-decoration: underline;

        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            text-align: center;

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #edf2f7;

            color: #9aabbc;

            font-size: 12px;

        }


        .footer strong {

            color: #087df5;

        }


        /* =========================
           ĐIỆN THOẠI
        ========================= */

        @media (max-width: 600px) {

            body {

                padding: 20px 15px;

            }


            .login-container {

                padding: 35px 25px;

                border-radius: 18px;

            }


            .login-header h1 {

                font-size: 24px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         KHUNG ĐĂNG NHẬP
    ========================= -->

    <div class="login-container">


        <!-- HEADER -->

        <div class="login-header">

            <div class="logo">
                🚌
            </div>


            <h1>
                ĐĂNG NHẬP
            </h1>


            <p>
                Đăng nhập để sử dụng Smart Bus
            </p>

        </div>


        <!-- =========================
             FORM ĐĂNG NHẬP
        ========================= -->

        <form id="loginForm">


            <!-- TÀI KHOẢN -->

            <div class="form-group">

                <label>

                    Tài khoản

                    <span class="required">
                        *
                    </span>

                </label>


                <div class="input-box">

                    <span class="input-icon">
                        👤
                    </span>


                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Nhập tài khoản"
                        required
                    >

                </div>

            </div>


            <!-- MẬT KHẨU -->

            <div class="form-group">

                <label>

                    Mật khẩu

                    <span class="required">
                        *
                    </span>

                </label>


                <div class="input-box">

                    <span class="input-icon">
                        🔒
                    </span>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Nhập mật khẩu"
                        required
                    >

                </div>

            </div>


            <!-- QUÊN MẬT KHẨU -->

            <div class="forgot-password">

                <a href="#">
                    Quên mật khẩu?
                </a>

            </div>


            <!-- NÚT ĐĂNG NHẬP -->

            <button
                type="submit"
                class="login-button"
            >

                Đăng nhập

            </button>


        </form>


        <!-- =========================
             ĐĂNG KÝ
        ========================= -->

        <div class="register-text">

            Bạn chưa có tài khoản?

            <a href="register.html">
                Đăng ký
            </a>

        </div>


        <!-- =========================
             FOOTER
        ========================= -->

        <div class="footer">

            🚌

            <strong>
                Smart Bus
            </strong>

            -

            Hệ thống đặt vé xe thông minh

        </div>


    </div>


    <!-- =========================
         KIỂM TRA ĐĂNG NHẬP
    ========================= -->

    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const username =
                    document.getElementById("username").value;

                const password =
                    document.getElementById("password").value;


                /* Kiểm tra tài khoản */

                if (username.trim() === "") {

                    alert("Vui lòng nhập tài khoản!");

                    return;

                }


                /* Kiểm tra mật khẩu */

                if (password.trim() === "") {

                    alert("Vui lòng nhập mật khẩu!");

                    return;

                }


                /* Nếu nhập đầy đủ */

                alert("Đăng nhập thành công!");

            });

    </script>


</body>

</html>
